name: UltraOptimize
version: ${project.version}
main: me.rimuru.ultraoptimize.UltraOptimize
api-version: 26.2
author: Rimuru
description: Advanced server optimization plugin with Paper support
commands:
  ultraoptimize:
    description: Main UltraOptimize command
    usage: /<command> [subcommand]
    aliases: [uo, optimize]
    permission: ultraoptimize.use
    permission-message: §cYou don't have permission to use this command!

permissions:
  ultraoptimize.*:
    description: Gives access to all UltraOptimize commands
    default: op
    children:
      ultraoptimize.use: true
      ultraoptimize.reload: true
      ultraoptimize.clear: true
      ultraoptimize.optimize: true
      ultraoptimize.stats: true
      ultraoptimize.chunks: true
      ultraoptimize.preload: true
      ultraoptimize.gc: true
      ultraoptimize.auto: true
      ultraoptimize.merge: true
      ultraoptimize.view: true
      ultraoptimize.report: true
      ultraoptimize.info: true
      ultraoptimize.notify: true
      ultraoptimize.paper: true
      ultraoptimize.paper.watchdog: true
      ultraoptimize.paper.regions: true

  ultraoptimize.use:
    description: Allows use of basic commands
    default: true

  ultraoptimize.reload:
    description: Allows reloading the configuration
    default: op

  ultraoptimize.clear:
    description: Allows clearing entities
    default: op

  ultraoptimize.optimize:
    description: Allows running manual optimization
    default: op

  ultraoptimize.stats:
    description: Allows viewing statistics
    default: op

  ultraoptimize.chunks:
    description: Allows managing chunks
    default: op

  ultraoptimize.preload:
    description: Allows managing chunk preloading
    default: op

  ultraoptimize.gc:
    description: Allows running garbage collection
    default: op

  ultraoptimize.auto:
    description: Allows toggling auto-optimization
    default: op

  ultraoptimize.merge:
    description: Allows merging items and XP
    default: op

  ultraoptimize.view:
    description: Allows changing view distance
    default: op

  ultraoptimize.report:
    description: Allows generating performance reports
    default: op

  ultraoptimize.info:
    description: Allows viewing plugin info
    default: op

  ultraoptimize.notify:
    description: Receives optimization notifications
    default: op

  ultraoptimize.paper:
    description: Allows access to Paper-specific commands
    default: op

  ultraoptimize.paper.watchdog:
    description: Allows managing watchdog monitor
    default: op

  ultraoptimize.paper.regions:
    description: Allows managing region files
    default: op