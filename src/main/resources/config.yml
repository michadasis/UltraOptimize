# ================================
# UltraOptimize Configuration File
# ================================
# Version: 2.3
# Supporting MC 1.8.9-26.2+
# Paper Optimization Features
# ================================

# Auto-Optimization Settings
auto-optimize:
  # Enable automatic optimization when TPS drops below threshold
  enabled: true
  # Interval in seconds between optimization checks
  interval: 300
  # TPS threshold to trigger optimization (1-20)
  tps-threshold: 18

# Entity Management Settings
entities:
  # Maximum entities allowed per chunk
  max-per-chunk: 50
  # Maximum items allowed per chunk
  max-items-per-chunk: 100
  # Radius around players to clear entities (0 = disabled)
  clear-radius: 0
  # Remove drops from killed mobs during optimization
  remove-drops: false
  # Clear entities when server is lagging
  clear-lagging: true
  # Limit entity spawns based on chunk capacity
  limit-spawns: true
  # Merge nearby items automatically
  auto-merge-items: true
  # Merge radius for items (blocks)
  item-merge-radius: 1.5
  # Entity types that are exempt from optimization
  exempt-types:
    - VILLAGER
    - PLAYER
    - ARMOR_STAND
    - ITEM_FRAME
    - PAINTING
    - MINECART
    - BOAT
    - WITHER
    - ENDER_DRAGON

# Chunk Management Settings
chunks:
  # Unload chunks with minimal entities
  unload-empty: true
  # Force chunk format upgrades (use with caution)
  force-upgrade: false
  # Maximum number of loaded chunks (0 = unlimited)
  max-loaded: 0
  # Radius around players where chunks won't be unloaded
  unload-radius: 8
  # Enable aggressive chunk unloading.
  # OFF by default: the server already unloads chunks nobody is near, and each
  # pass here forces a synchronous save of every chunk it unloads. It also
  # fights chunk-preloading and paper.chunk-system.ticket-spawn-chunks below.
  aggressive-unload: false
  # Interval in seconds between chunk unload checks
  unload-interval: 300

# Spawn Chunk Preloading Settings
chunk-preloading:
  # Enable spawn chunk preloading on server startup.
  # OFF by default: loaded chunks are the largest single consumer of heap on a
  # Minecraft server, and this loads (2*radius+1)^2 of them per world whether
  # or not anyone is near spawn. On a 1GB heap, leave this off.
  enabled: false
  # Radius of chunks to preload around spawn point in each world
  # Higher = more chunks loaded but longer startup time
  preload-radius: 5
  # Number of chunks to load per tick (1-5 recommended)
  # Lower = less lag during preloading but takes longer
  chunks-per-tick: 3
  # Preload chunks in spiral pattern (smoother) or square pattern
  spiral-pattern: true
  # Enable chunk generation during preload (may cause lag)
  generate-chunks: false
  # Notify admins when preloading is complete
  notify-preloading: true

# Performance Optimization Settings
performance:
  # Suppress redstone updates for a block that fires more than 100 times per
  # second. OFF by default: this does not make redstone cheaper (the block
  # still ticks, the update just becomes a no-op) and it silently stalls
  # clocks and jams piston doors once a build crosses the threshold.
  optimize-redstone: false
  # Throttle hopper item transfers. OFF by default, and read this first:
  # vanilla only sets a hopper's 8-tick cooldown when a transfer SUCCEEDS, so
  # cancelling the transfer means the hopper retries next tick instead of in 8.
  # A throttled hopper therefore does MORE work than an unthrottled one. Only
  # worth enabling at rates well above 8, and it will break item sorters.
  optimize-hoppers: false
  # Maximum hoppers allowed per chunk (logs a warning above this; does not remove hoppers)
  max-hoppers-per-chunk: 10
  # Minimum ticks between item transfers per hopper (vanilla default is 8).
  # Higher = fewer transfers per second = less lag from hopper-heavy builds.
  hopper-tick-rate: 8
  # RESERVED FOR A FUTURE RELEASE - not currently functional.
  # There is no generic Bukkit/Paper API to hook vanilla lighting
  # recalculation, so this key has no effect yet.
  optimize-lighting: true
  # RESERVED FOR A FUTURE RELEASE - not currently functional.
  # There is no generic Bukkit/Paper API to intercept arbitrary vanilla
  # particle effects (weather, block break, potion auras, etc.), so these
  # two keys have no effect yet. Kept in config for forward compatibility.
  reduce-particles: false
  # Percentage of particles to reduce (0-100) - see note above
  particle-reduction: 50

# Advanced Settings
advanced:
  # Use asynchronous chunk processing (recommended)
  async-chunks: true
  # Periodically disable AI/pathfinding (Mob#setAware) for mobs outside
  # pathfinding-limit blocks of every player, to cut CPU cost from
  # far-away mob goal/pathfinding processing.
  optimize-ai: true
  # Distance (blocks) from the nearest player within which mob AI stays active
  pathfinding-limit: 32
  # Master switch for view distance optimization - must be true for
  # auto-view-distance below to take effect.
  # Requires Paper or a Paper-based fork (e.g. Purpur): the underlying
  # World#setViewDistance API this depends on does not exist on plain
  # Spigot at any Minecraft version, so this has no effect there.
  optimize-view-distance: false
  # Automatically adjust view distance based on TPS (requires optimize-view-distance: true)
  auto-view-distance: false
  # Minimum view distance when auto-adjusting
  min-view-distance: 3
  # Maximum view distance when auto-adjusting
  max-view-distance: 10
  # Scale how often the AI optimization sweep (above) runs: interval = entity-tick-rate * 1 second
  optimize-entity-ticking: true
  # AI sweep interval in seconds when optimize-entity-ticking is true (1 = every second, 2 = every 2 seconds, ...)
  entity-tick-rate: 1

# Paper-Specific Optimizations (Only active on Paper servers)
paper:
  # Enable Paper-specific optimizations
  enabled: true

  # CPU Usage Profile (affects monitoring frequency and detail)
  # LOW: Minimal monitoring, very low CPU usage (~0.1-0.5%)
  # MEDIUM: Balanced monitoring, moderate CPU usage (~0.5-1.5%)
  # HIGH: Detailed monitoring, higher CPU usage (~1.5-3%)
  cpu-profile: LOW

  # Advanced Chunk System
  chunk-system:
    # Use chunk tickets to keep important chunks loaded
    use-chunk-tickets: true
    # Keep spawn chunks loaded with tickets.
    # OFF by default: these tickets are permanent, so the chunks can never
    # unload while the plugin is enabled, and they tick. That is a fixed
    # memory cost of roughly (2*radius+1)^2 chunks per world.
    ticket-spawn-chunks: false
    # Spawn chunk ticket radius
    spawn-ticket-radius: 3
    # Use urgent chunk loading for high-priority chunks
    use-urgent-loading: true

  # Watchdog Monitor
  watchdog:
    # Enable watchdog hang detection
    enabled: true
    # Hang threshold in milliseconds
    hang-threshold: 10000
    # Critical hang threshold (triggers emergency mode)
    critical-threshold: 30000
    # Number of hangs before triggering emergency mode
    emergency-trigger-count: 3
    # Auto-trigger emergency optimization on critical hangs.
    # OFF by default. Emergency optimization is a full entity sweep plus a
    # chunk unload pass; handing that to a server that is already failing to
    # keep up usually makes things worse, not better. When enabled it is rate
    # limited to once every 5 minutes.
    auto-emergency-optimization: false

  # Region File Optimization
  region-files:
    # Enable region file reporting and cleanup tooling
    enabled: true
    # Periodically save every world.
    # OFF by default. There is NO API for an incremental or asynchronous world
    # save - despite what this option used to be called, enabling it performs a
    # FULL, SYNCHRONOUS save of every loaded chunk in every world, on the main
    # thread, on the interval below. On a low-memory host with a shared disk
    # that is a visible freeze every time it fires.
    incremental-saving: false
    # World save interval in seconds (minimum 300)
    save-interval: 900
    # Auto-remove empty region files. This DELETES world data - leave it off
    # unless you have a backup.
    remove-empty-regions: false

# Notification Settings
notifications:
  # Notify only admins with ultraoptimize.notify permission
  notify-admins: true
  # Broadcast optimization results to all players
  broadcast-optimization: true
  # Show statistics in notifications
  show-statistics: true
  # Notify when watchdog detects hangs (Paper only)
  notify-hangs: true
  # Notify when emergency mode activates (Paper only)
  notify-emergency: true

# World Settings
worlds:
  # List of worlds where optimization is enabled (empty = all worlds)
  enabled-worlds: []
  # List of worlds to exclude from optimization
  excluded-worlds: []

# ================================
# Configuration Notes:
# ================================
# RUNNING ON A SMALL HEAP (1-2GB):
# - The defaults above are chosen for exactly this case. Everything that costs
#   memory or forces disk I/O on a timer ships disabled.
# - The biggest wins on a small heap are not in this file: lower view-distance
#   and simulation-distance in server.properties, and keep entity counts down.
# - Do not enable chunk-preloading, ticket-spawn-chunks, or
#   region-files.incremental-saving together. Each one pins memory or stalls
#   the main thread, and the first two also fight aggressive-unload.
#
# SPAWN CHUNK PRELOADING:
# - Preloads chunks around spawn point on server startup
# - Costs memory for as long as those chunks stay loaded; on a small heap this
#   is a net loss, which is why it defaults to off
# - Preloading happens once per server start, not continuously
#
# PAPER OPTIMIZATIONS:
# - Only active when running on Paper server
# - Chunk tickets keep important chunks loaded
# - Watchdog monitors for server hangs and auto-triggers emergency optimization
# - Region optimization reduces disk usage and improves chunk loading
# - Incremental saving reduces lag spikes during world saves
#
# WATCHDOG MONITOR:
# - Detects when the MAIN THREAD stalls, using a heartbeat watched from a
#   separate thread. A slow server is not a hung server: at 5 TPS the gap
#   between ticks is ~200ms, nowhere near the 10s default threshold.
# - Emergency mode runs one entity sweep and chunk unload pass, rate limited
#   to once every 5 minutes, and never forces a GC.
# - It stands down automatically once the server has been healthy for 30s.
#
# REGION FILE OPTIMIZATION:
# - "incremental-saving" is a full synchronous world save; see the note above
# - Region scanning runs off the main thread and is report-only
# - Empty region removal DELETES world data - back up first
#
# HOPPER & AI OPTIMIZATION:
# - hopper-tick-rate throttles item transfers per hopper (8 = vanilla default)
# - optimize-ai pauses AI/pathfinding for mobs beyond pathfinding-limit
#   blocks from every player; entity-tick-rate controls how often that
#   check re-runs when optimize-entity-ticking is true
#
# VIEW DISTANCE CONTROL:
# - optimize-view-distance and auto-view-distance, and the /uo view
#   command, all require Paper or a Paper-based fork (e.g. Purpur)
# - plain Spigot has no API to change view distance at runtime, so these
#   settings are silently inert there regardless of Minecraft version
#
# PERFORMANCE TIPS:
# - Enable async-chunks for best performance
# - Lower TPS threshold = more frequent optimization
# - Higher entity limits = less aggressive optimization
# - Measure before and after with a profiler (Spark) rather than trusting any
#   plugin's own claims, including this one's
# ================================